    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.7;color:#2A3320;

      .card{background:#fff;max-width:380px;width:100%;padding:34px 28px 28px;border-radius:24px;border:1px solid #ece5d5;box-shadow:0 18px 50px rgba(80,65,35,.12)}

      .home-btn:hover{transform:translateY(-2px)}
      .links{margin-top:18px;font-size:13px}
      .links a{color:#3E6B4A;font-weight:600;text-decoration:none;margin:0 9px}
